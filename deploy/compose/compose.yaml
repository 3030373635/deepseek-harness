name: dsh-web

services:
  dsh:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-}
        DSH_CLIENT_TITLE: ${DSH_CLIENT_TITLE:-衡枢}
        NPM_REGISTRY: ${DSH_NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:?Set DSH_PUBLIC_URL in .env}
      DSH_UID: ${DSH_UID:-1000}
      DSH_GID: ${DSH_GID:-1000}
    volumes:
      # Account hashes, signing keys, configuration, and sessions share DSH_HOME.
      - dsh-data:/data
      - ./workspace:/workspace
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          import http from 'node:http';
          const request = http.get('http://dsh:3080/login', {
            headers: { host: new URL(process.env.DSH_PUBLIC_URL).host }
          }, response => {
            response.resume();
            if (response.statusCode !== 200) process.exitCode = 1;
          });
          request.on('error', () => { process.exitCode = 1; });
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
  nginx:
    image: nginx:1.29.2
    depends_on:
      dsh:
        condition: service_healthy
        restart: true
    ports:
      - "${DSH_BIND_ADDRESS:?Set DSH_BIND_ADDRESS in .env}:${DSH_HTTPS_PORT:-3443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      # Only this internal probe skips certificate verification; browsers must trust the certificate.
      test: [CMD, curl, --fail, --silent, --insecure, --output, /dev/null, --connect-to, "::127.0.0.1:443", "${DSH_PUBLIC_URL:?Set DSH_PUBLIC_URL in .env}/login"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  dsh-data:
