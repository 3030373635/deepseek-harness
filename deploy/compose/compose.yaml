name: dsh-web

services:
  dsh:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-}
        DSH_CLIENT_TITLE: ${DSH_CLIENT_TITLE:-衡枢}
        DSH_BUILD_CHECK_HEAP_MB: ${DSH_BUILD_CHECK_HEAP_MB:-8192}
        NPM_REGISTRY: ${DSH_NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:?Set DSH_PUBLIC_URL in .env}
      DSH_UID: ${DSH_UID:-1000}
      DSH_GID: ${DSH_GID:-1000}
      DSH_WEB_HOME: ${DSH_WEB_HOME:-}
    ports:
      - "${DSH_BIND_ADDRESS:?Set DSH_BIND_ADDRESS in .env}:${DSH_HTTP_PORT:-3080}:3080"
    volumes:
      # Host-managed DSH_HOME holds skills, accounts, keys, configuration, and sessions.
      - ./volumes/config/.dsh:/data
      - type: bind
        source: ./volumes/data/workspace
        target: /workspace
        bind:
          create_host_path: false
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          import http from 'node:http';
          const request = http.get('http://dsh:3080/login', {
            headers: { host: new URL(process.env.DSH_PUBLIC_URL).host }
          }, response => {
            response.resume();
            if (response.statusCode !== 200) process.exitCode = 1;
          });
          request.on('error', () => { process.exitCode = 1; });
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
