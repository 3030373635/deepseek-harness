- id: authentication-token
  disabled: true

# The local login owns the Web account UI. DeepSeek notifications depend on the original account UI.
- id: ui-settings-account
  disabled: true
- id: ui-account-notifications
  disabled: true

- insert:
    - id: web-password-login
      name: dsh-web-login
      inject: [profileContext, webStartup]
      config:
        databasePath: !!js "ctx.profileContext.home + '/auth/users.sqlite'"
        secureCookies: !!js "ctx.webStartup.tls !== undefined || ctx.webStartup.publicUrl?.startsWith('https://') === true"
