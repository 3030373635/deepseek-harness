- id: authentication-token
  disabled: true
- id: remote-connection
  disabled: true

# Stop the original login service from releasing saved account grants to models and Web tools.
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true

# DeepSeek notifications depend on the original account UI.
- id: ui-settings-account
  disabled: true
- id: ui-account-notifications
  disabled: true

- id: session-log-deepseek
  config:
    enabled: false

- insert:
    - id: web-password-login
      name: ./lib/index.js
      inject: [profileContext, webStartup]
      config:
        databasePath: !!js "ctx.profileContext.home + '/auth/users.sqlite'"
        secureCookies: !!js "ctx.webStartup.tls !== undefined || ctx.webStartup.publicUrl?.startsWith('https://') === true"
        deploymentManaged: !!js "process.env.DSH_WEB_CUSTOM_DEPLOYMENT_MANAGED === '1'"
